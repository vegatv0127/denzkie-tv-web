<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Denzkie TV — Web Player</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    :root {
      --bg: #070709;
      --surface: #11131a;
      --surface-2: #181b24;
      --border: rgba(255,255,255,0.09);
      --red: #ef233c;
      --red-dark: #b91c1c;
      --text: #f9fafb;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background:
        radial-gradient(circle at 50% -15%, rgba(239,35,60,0.22), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    button, input, select { font: inherit; color: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      padding: 12px 20px;
      background: rgba(7,7,9,0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.15rem; cursor: pointer; }
    .brand img { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; }
    .brand span {
      background: linear-gradient(135deg, #fff, #9ca3af);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav-tabs { display: flex; gap: 6px; margin-left: 8px; }
    .tab-btn {
      padding: 8px 14px; border-radius: 10px; border: 1px solid transparent;
      background: transparent; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 0.9rem;
    }
    .tab-btn.active { background: rgba(239,35,60,0.16); border-color: rgba(239,35,60,0.45); color: #fff; }
    .controls { display: flex; flex: 1; gap: 10px; justify-content: flex-end; align-items: center; min-width: 260px; }
    .select, .input {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 12px; font-size: 0.9rem; outline: none;
    }
    .select { max-width: 200px; }
    .search-box { display: flex; flex: 1; max-width: 320px; gap: 6px; }
    .search-box .input { width: 100%; }
    .btn {
      padding: 9px 15px; border-radius: 10px; border: none; cursor: pointer;
      font-weight: 700; font-size: 0.88rem; transition: 0.15s ease;
    }
    .btn-red { background: linear-gradient(135deg, var(--red), var(--red-dark)); color: #fff; }
    .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: #fff; }
    .btn:hover { filter: brightness(1.1); }

    .wrap { max-width: 1280px; margin: 0 auto; padding: 20px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 14px; }
    .chip {
      flex-shrink: 0; padding: 7px 14px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
    .chip.active { background: var(--red); border-color: var(--red); color: #fff; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(239,35,60,0.6); }
    .poster { aspect-ratio: 2 / 3; width: 100%; object-fit: cover; background: #0d0f14; display: block; }
    .card-body { padding: 10px 11px; }
    .card-title {
      font-size: 0.88rem; font-weight: 700; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-sub { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .status { text-align: center; padding: 48px 16px; color: var(--muted); }
    .load-more { display: flex; justify-content: center; margin-top: 26px; }

    .modal-bg {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.82); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: 100%; max-width: 860px; max-height: 90vh; overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 22px; position: relative;
    }
    .close-x {
      position: sticky; top: 0; float: right;
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      color: #fff; cursor: pointer; font-weight: 800;
    }
    .meta-head { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 20px; }
    .meta-poster { width: 170px; aspect-ratio: 2/3; object-fit: cover; border-radius: 14px; background: #000; }
    .meta-info { flex: 1; min-width: 230px; }
    .meta-info h2 { font-size: 1.55rem; margin-bottom: 8px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tag { font-size: 0.75rem; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: #d1d5db; }
    .synopsis { color: var(--muted); font-size: 0.92rem; line-height: 1.55; margin-bottom: 14px; }

    .list-section { margin-top: 16px; }
    .list-section h4 { margin-bottom: 10px; font-size: 0.95rem; color: #e5e7eb; }
    .item-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 14px; border-radius: 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .video-box { width: 100%; background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 14px; }
    video { width: 100%; max-height: 68vh; display: block; background: #000; }
    .server-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" onclick="switchTab('browse')">
      <img src="/logo.png" alt="Denzkie TV" />
      <span>Denzkie TV</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-browse" onclick="switchTab('browse')">Browse</button>
      <button class="tab-btn" id="tab-watchlist" onclick="switchTab('watchlist')">Watchlist</button>
      <button class="tab-btn" id="tab-history" onclick="switchTab('history')">History</button>
    </div>
    <div class="controls">
      <select class="select" id="providerSelect" onchange="onProviderChange()"></select>
      <form class="search-box" onsubmit="onSearch(event)">
        <input class="input" id="searchInput" placeholder="Search movies & shows..." />
        <button class="btn btn-red" type="submit">Search</button>
      </form>
      <button class="btn btn-ghost" onclick="openSourceModal()">Source</button>
    </div>
  </header>

  <main class="wrap">
    <div class="chips" id="catalogChips"></div>
    <div id="contentArea"></div>
    <div class="load-more" id="loadMoreWrap" style="display:none;">
      <button class="btn btn-ghost" onclick="loadNextPage()">Load More</button>
    </div>
  </main>

  <div class="modal-bg" id="detailModal">
    <div class="modal">
      <button class="close-x" onclick="closeModal('detailModal')">✕</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <div class="modal-bg" id="playerModal">
    <div class="modal" style="max-width:980px;">
      <button class="close-x" onclick="closePlayer()">✕</button>
      <h3 id="playerTitle" style="margin-bottom:12px;"></h3>
      <div class="video-box">
        <video id="videoEl" controls playsinline autoplay></video>
      </div>
      <div class="server-pills" id="serverPills"></div>
      <div id="playerNote" style="font-size:0.84rem; color:var(--muted);"></div>
    </div>
  </div>

  <div class="modal-bg" id="sourceModal">
    <div class="modal" style="max-width:540px;">
      <button class="close-x" onclick="closeModal('sourceModal')">✕</button>
      <h3 style="margin-bottom:10px;">Provider Source URL</h3>
      <p style="color:var(--muted); font-size:0.9rem; margin-bottom:14px;">
        Enter a GitHub or raw manifest provider repository URL.
      </p>
      <input class="input" id="sourceInput" style="width:100%; margin-bottom:14px;" />
      <div style="display:flex; gap:10px; justify-content:flex-end;">
        <button class="btn btn-ghost" onclick="resetSource()">Reset Default</button>
        <button class="btn btn-red" onclick="saveSource()">Save &amp; Reload</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_SOURCE = 'https://github.com/vegatv0127/vegatv-providers';
    const state = {
      source: localStorage.getItem('denzkie_source') || DEFAULT_SOURCE,
      providers: [],
      provider: localStorage.getItem('denzkie_provider') || '',
      catalog: [],
      filter: '',
      query: '',
      page: 1,
      posts: [],
      tab: 'browse',
      hls: null,
    };

    const imgUrl = url => url ? `/api/img?url=${encodeURIComponent(url)}` : '/logo.png';
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const getList = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
    const setList = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    async function api(path) {
      const sep = path.includes('?') ? '&' : '?';
      const r = await fetch(`${path}${sep}source=${encodeURIComponent(state.source)}`);
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Request failed');
      return j;
    }

    async function init() {
      document.getElementById('contentArea').innerHTML = '<div class="status">Loading providers...</div>';
      try {
        const data = await api('/api/providers');
        state.providers = data.providers || [];
        const sel = document.getElementById('providerSelect');
        sel.innerHTML = state.providers.map(p =>
          `<option value="${esc(p.value)}">${esc(p.display_name)} (${esc(p.type)})</option>`
        ).join('');
        if (!state.provider || !state.providers.some(p => p.value === state.provider)) {
          state.provider = state.providers[0]?.value || '';
        }
        sel.value = state.provider;
        await loadProviderCatalog();
      } catch (e) {
        document.getElementById('contentArea').innerHTML = `<div class="status">Failed to load providers: ${esc(e.message)}</div>`;
      }
    }

    async function onProviderChange() {
      state.provider = document.getElementById('providerSelect').value;
      localStorage.setItem('denzkie_provider', state.provider);
      state.query = '';
      document.getElementById('searchInput').value = '';
      switchTab('browse');
      await loadProviderCatalog();
    }

    async function loadProviderCatalog() {
      if (!state.provider) return;
      document.getElementById('catalogChips').innerHTML = '';
      document.getElementById('contentArea').innerHTML = '<div class="status">Loading catalog...</div>';
      try {
        const data = await api(`/api/catalog?provider=${encodeURIComponent(state.provider)}`);
        state.catalog = [...(data.catalog || []), ...(data.genres || [])];
        state.filter = state.catalog[0]?.filter ?? '';
        renderChips();
        await loadPosts(true);
      } catch (e) {
        document.getElementById('contentArea').innerHTML = `<div class="status">Error: ${esc(e.message)}</div>`;
      }
    }

    function renderChips() {
      const el = document.getElementById('catalogChips');
      if (state.tab !== 'browse') { el.innerHTML = ''; return; }
      el.innerHTML = state.catalog.map((c, idx) =>
        `<button class="chip ${c.filter === state.filter && !state.query ? 'active' : ''}" onclick="selectFilter(${idx})">${esc(c.title)}</button>`
      ).join('');
    }

    function selectFilter(idx) {
      state.query = '';
      document.getElementById('searchInput').value = '';
      state.filter = state.catalog[idx]?.filter ?? '';
      renderChips();
      loadPosts(true);
    }

    function onSearch(e) {
      e.preventDefault();
      state.query = document.getElementById('searchInput').value.trim();
      switchTab('browse', false);
      renderChips();
      loadPosts(true);
    }

    async function loadPosts(reset = true) {
      if (reset) {
        state.page = 1;
        state.posts = [];
        document.getElementById('contentArea').innerHTML = '<div class="status">Loading titles...</div>';
      }
      try {
        const qParam = state.query ? `&q=${encodeURIComponent(state.query)}` : '';
        const data = await api(`/api/posts?provider=${encodeURIComponent(state.provider)}&filter=${encodeURIComponent(state.filter)}&page=${state.page}${qParam}`);
        const items = (data.posts || []).map(p => ({ ...p, provider: p.provider || state.provider }));
        state.posts = reset ? items : [...state.posts, ...items];
        renderGrid(state.posts);
        document.getElementById('loadMoreWrap').style.display = items.length >= 6 ? 'flex' : 'none';
      } catch (e) {
        document.getElementById('contentArea').innerHTML = `<div class="status">Provider error: ${esc(e.message)}</div>`;
        document.getElementById('loadMoreWrap').style.display = 'none';
      }
    }

    function loadNextPage() {
      state.page += 1;
      loadPosts(false);
    }

    function switchTab(tab, refresh = true) {
      state.tab = tab;
      ['browse','watchlist','history'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
      });
      renderChips();
      if (tab === 'browse') {
        if (refresh) renderGrid(state.posts);
      } else if (tab === 'watchlist') {
        document.getElementById('loadMoreWrap').style.display = 'none';
        renderGrid(getList('denzkie_watchlist'));
      } else {
        document.getElementById('loadMoreWrap').style.display = 'none';
        renderGrid(getList('denzkie_history'));
      }
    }

    function renderGrid(items) {
      const el = document.getElementById('contentArea');
      if (!items.length) {
        el.innerHTML = '<div class="status">No titles found.</div>';
        return;
      }
      el.innerHTML = `<div class="grid">${items.map(item => `
        <div class="card" onclick='openDetail(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
          <img class="poster" loading="lazy" src="${imgUrl(item.image)}" onerror="this.src='/logo.png'" alt="${esc(item.title)}" />
          <div class="card-body">
            <div class="card-title">${esc(item.title)}</div>
            <div class="card-sub">${esc(item.provider || state.provider)}</div>
          </div>
        </div>
      `).join('')}</div>`;
    }

    async function openDetail(item) {
      const prov = item.provider || state.provider;
      document.getElementById('detailBody').innerHTML = '<div class="status">Loading details...</div>';
      document.getElementById('detailModal').classList.add('open');

      const hist = getList('denzkie_history').filter(x => x.link !== item.link);
      hist.unshift({ ...item, provider: prov });
      setList('denzkie_history', hist.slice(0, 40));

      try {
        const { meta } = await api(`/api/meta?provider=${encodeURIComponent(prov)}&link=${encodeURIComponent(item.link)}`);
        const inWatch = getList('denzkie_watchlist').some(x => x.link === item.link);
        const poster = meta.poster || meta.image || item.image;
        const tags = (meta.tags || []).slice(0, 6).map(t => `<span class="tag">${esc(t)}</span>`).join('');

        let linksHtml = '';
        (meta.linkList || []).forEach((grp, idx) => {
          if (grp.directLinks?.length) {
            linksHtml += `<div class="list-section"><h4>${esc(grp.title || 'Play')}</h4>` +
              grp.directLinks.map(dl => `
                <div class="item-row">
                  <span>${esc(dl.title || grp.title)}</span>
                  <button class="btn btn-red" onclick='playStream(${JSON.stringify({ provider: prov, link: dl.link, type: dl.type || meta.type || "movie", title: `${meta.title} - ${dl.title || grp.title}` }).replace(/'/g, "&#39;")})'>Watch</button>
                </div>
              `).join('') + `</div>`;
          } else if (grp.episodesLink) {
            linksHtml += `
              <div class="item-row">
                <span>${esc(grp.title || 'Season')}</span>
                <button class="btn btn-ghost" onclick='loadEpisodes(this, ${JSON.stringify({ provider: prov, url: grp.episodesLink, type: meta.type || "series", baseTitle: meta.title }).replace(/'/g, "&#39;")})'>Load Episodes</button>
              </div>
              <div id="eps-${idx}"></div>
            `;
          }
        });

        document.getElementById('detailBody').innerHTML = `
          <div class="meta-head">
            <img class="meta-poster" src="${imgUrl(poster)}" onerror="this.src='/logo.png'" />
            <div class="meta-info">
              <h2>${esc(meta.title || item.title)}</h2>
              <div class="tags">
                ${meta.type ? `<span class="tag">${esc(meta.type)}</span>` : ''}
                ${meta.rating ? `<span class="tag">★ ${esc(meta.rating)}</span>` : ''}
                ${tags}
              </div>
              <p class="synopsis">${esc(meta.synopsis || 'No synopsis available.')}</p>
              <button class="btn btn-ghost" id="watchBtn" onclick='toggleWatchlist(${JSON.stringify({ ...item, provider: prov, title: meta.title || item.title, image: poster }).replace(/'/g, "&#39;")})'>
                ${inWatch ? '✓ In Watchlist' : '+ Add to Watchlist'}
              </button>
            </div>
          </div>
          ${linksHtml || '<div class="status">No playable links found for this title.</div>'}
        `;
      } catch (e) {
        document.getElementById('detailBody').innerHTML = `<div class="status">Failed to load metadata: ${esc(e.message)}</div>`;
      }
    }

    function toggleWatchlist(item) {
      let list = getList('denzkie_watchlist');
      const exists = list.some(x => x.link === item.link);
      list = exists ? list.filter(x => x.link !== item.link) : [item, ...list];
      setList('denzkie_watchlist', list);
      document.getElementById('watchBtn').textContent = exists ? '+ Add to Watchlist' : '✓ In Watchlist';
    }

    async function loadEpisodes(btn, opts) {
      const container = btn.parentElement.nextElementSibling;
      btn.disabled = true;
      btn.textContent = 'Loading...';
      try {
        const { episodes } = await api(`/api/episodes?provider=${encodeURIComponent(opts.provider)}&url=${encodeURIComponent(opts.url)}`);
        container.innerHTML = (episodes || []).map(ep => `
          <div class="item-row" style="margin-left:14px;">
            <span>${esc(ep.title)}</span>
            <button class="btn btn-red" onclick='playStream(${JSON.stringify({ provider: opts.provider, link: ep.link, type: opts.type, title: `${opts.baseTitle} - ${ep.title}` }).replace(/'/g, "&#39;")})'>Watch</button>
          </div>
        `).join('') || '<div style="padding:8px;color:var(--muted);">No episodes returned.</div>';
        btn.textContent = 'Loaded';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Retry';
        container.innerHTML = `<div style="color:#fca5a5;padding:8px;">${esc(e.message)}</div>`;
      }
    }

    function encodeHeaders(h) {
      if (!h || !Object.keys(h).length) return '';
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(h))));
      return '&h=' + encodeURIComponent(b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''));
    }

    async function playStream({ provider, link, type, title }) {
      document.getElementById('playerTitle').textContent = title;
      document.getElementById('serverPills').innerHTML = '<span style="color:var(--muted);">Fetching streams...</span>';
      document.getElementById('playerNote').textContent = '';
      document.getElementById('playerModal').classList.add('open');

      try {
        const { streams } = await api(`/api/streams?provider=${encodeURIComponent(provider)}&link=${encodeURIComponent(link)}&type=${encodeURIComponent(type)}`);
        if (!streams.length) {
          document.getElementById('serverPills').innerHTML = '<span style="color:#fca5a5;">No streams returned by provider.</span>';
          return;
        }
        document.getElementById('serverPills').innerHTML = streams.map((s, idx) =>
          `<button class="chip ${idx === 0 ? 'active' : ''}" onclick='selectStream(${idx}, ${JSON.stringify(streams).replace(/'/g, "&#39;")})'>${esc(s.server)} ${s.quality ? '(' + esc(s.quality) + ')' : ''}</button>`
        ).join('');
        selectStream(0, streams);
      } catch (e) {
        document.getElementById('serverPills').innerHTML = `<span style="color:#fca5a5;">Error: ${esc(e.message)}</span>`;
      }
    }

    function selectStream(idx, streams) {
      document.querySelectorAll('#serverPills .chip').forEach((c, i) => c.classList.toggle('active', i === idx));
      const s = streams[idx];
      const video = document.getElementById('videoEl');
      if (state.hls) { state.hls.destroy(); state.hls = null; }

      const proxied = `/api/proxy?url=${encodeURIComponent(s.link)}${encodeHeaders(s.headers)}`;
      const isHls = s.type === 'm3u8' || /\.m3u8(\?|$)/i.test(s.link);

      if (isHls && window.Hls && Hls.isSupported()) {
        state.hls = new Hls();
        state.hls.loadSource(proxied);
        state.hls.attachMedia(video);
      } else {
        video.src = proxied;
      }
      video.play().catch(() => {});

      document.getElementById('playerNote').innerHTML =
        `Playing via proxy (${esc(s.server)}). If a browser cannot decode an MKV audio track, <a href="${esc(s.link)}" target="_blank" style="color:#fca5a5;text-decoration:underline;">open direct stream URL</a> in VLC or download it.`;
    }

    function closePlayer() {
      const video = document.getElementById('videoEl');
      video.pause();
      video.removeAttribute('src');
      video.load();
      if (state.hls) { state.hls.destroy(); state.hls = null; }
      closeModal('playerModal');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function openSourceModal() {
      document.getElementById('sourceInput').value = state.source;
      document.getElementById('sourceModal').classList.add('open');
    }
    function resetSource() { document.getElementById('sourceInput').value = DEFAULT_SOURCE; }
    function saveSource() {
      state.source = document.getElementById('sourceInput').value.trim() || DEFAULT_SOURCE;
      localStorage.setItem('denzkie_source', state.source);
      closeModal('sourceModal');
      init();
    }

    init();
  </script>
</body>
</html>
